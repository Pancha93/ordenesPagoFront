<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Sistema de Órdenes de Pago</h1>
      <p>Inicie sesión para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Campo Email -->
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="usuario@ejemplo.com"
          [class.error]="hasError('email')"
        />
        <span class="error-message" *ngIf="hasError('email')">
          {{ getErrorMessage('email') }}
        </span>
      </div>

      <!-- Campo Password -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="••••••••"
          [class.error]="hasError('password')"
        />
        <span class="error-message" *ngIf="hasError('password')">
          {{ getErrorMessage('password') }}
        </span>
      </div>

      <!-- Botón de login -->
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Iniciar Sesión</span>
        <span *ngIf="loading">Iniciando sesión...</span>
      </button>
    </form>

    <!-- Información de usuarios de prueba -->
    <div class="test-users">
      <h3>Usuarios de Prueba:</h3>
      <div class="user-info">
        <strong>Admin:</strong> admin&#64;vortexbird.com / password123
      </div>
      <div class="user-info">
        <strong>Operador:</strong> operator&#64;vortexbird.com / password123
      </div>
    </div>
  </div>
</div>

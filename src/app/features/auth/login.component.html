<div class="login-container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
  <div class="card shadow-lg" style="max-width: 450px; width: 100%;">
    <div class="card-body p-5">
      <!-- Header -->
      <div class="text-center mb-4">
        <h1 class="h3 mb-2">Sistema de Órdenes de Pago</h1>
        <p class="text-muted">Inicie sesión para continuar</p>
      </div>

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Email Field -->
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
          <input
            type="email"
            id="email"
            class="form-control"
            [class.is-invalid]="hasError('email')"
            formControlName="email"
            placeholder="usuario@ejemplo.com"
          />
          <div class="invalid-feedback" *ngIf="hasError('email')">
            {{ getErrorMessage('email') }}
          </div>
        </div>

        <!-- Password Field -->
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Contraseña</label>
          <input
            type="password"
            id="password"
            class="form-control"
            [class.is-invalid]="hasError('password')"
            formControlName="password"
            placeholder="••••••••"
          />
          <div class="invalid-feedback" *ngIf="hasError('password')">
            {{ getErrorMessage('password') }}
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="loading">
          <span *ngIf="!loading">Iniciar Sesión</span>
          <span *ngIf="loading">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Iniciando sesión...
          </span>
        </button>
      </form>
    </div>
  </div>
</div>

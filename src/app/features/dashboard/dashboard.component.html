<div class="d-flex" style="height: 100vh; overflow: hidden;">
  <!-- Sidebar -->
  <aside class="bg-dark text-white d-flex flex-column" 
         [ngClass]="{'translate-middle-x': !menuOpen}" 
         style="width: 280px; transition: transform 0.3s ease; position: relative; z-index: 100;">
    
    <!-- Sidebar Header -->
    <div class="p-4 border-bottom border-secondary">
      <h2 class="h5 mb-0">🅾️ Órdenes de Pago</h2>
    </div>

    <!-- Navigation -->
    <nav class="nav flex-column flex-grow-1 py-3" style="overflow-y: auto;">
      <a
        *ngFor="let item of filteredMenuItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-link text-white-50 d-flex align-items-center px-4 py-3"
        style="border-left: 3px solid transparent; transition: all 0.2s;"
      >
        <span class="me-3" style="font-size: 20px; min-width: 24px;">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <!-- Sidebar Footer -->
    <div class="border-top border-secondary p-4">
      <!-- User Info -->
      <div class="d-flex gap-3 mb-3" *ngIf="currentUser">
        <div class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold" 
             style="width: 45px; height: 45px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); flex-shrink: 0; font-size: 20px;">
          {{ currentUser.fullName.charAt(0).toUpperCase() }}
        </div>
        <div class="flex-grow-1 overflow-hidden">
          <div class="fw-semibold text-truncate" style="font-size: 14px;">{{ currentUser.fullName }}</div>
          <div class="text-white-50 small text-truncate" style="font-size: 11px;">{{ currentUser.email }}</div>
          <span class="badge rounded-pill mt-1" [ngClass]="getRoleBadgeClass()" style="font-size: 10px;">
            {{ getRoleText() }}
          </span>
        </div>
      </div>

      <!-- Logout Button -->
      <button class="btn btn-danger w-100 d-flex align-items-center justify-content-center gap-2" 
              (click)="logout()"
              style="opacity: 0.9;">
        <span>🚪</span> Cerrar Sesión
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-grow-1 d-flex flex-column" style="overflow: hidden;">
    <!-- Topbar -->
    <header class="bg-white border-bottom p-3 d-flex align-items-center shadow-sm">
      <button class="btn btn-outline-secondary me-3" (click)="toggleMenu()">
        <span>☰</span>
      </button>
      <h1 class="h5 mb-0">Sistema de Gestión de Órdenes</h1>
    </header>

    <!-- Content Area -->
    <main class="flex-grow-1 p-4 bg-light" style="overflow-y: auto;">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Custom styles for active nav -->
<style>
  .nav-link.active {
    background-color: rgba(255, 255, 255, 0.15) !important;
    border-left-color: #0d6efd !important;
  }
  .nav-link:hover {
    background-color: rgba(255, 255, 255, 0.1);
    color: white !important;
  }
</style>
